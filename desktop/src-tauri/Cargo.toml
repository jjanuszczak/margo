[package]
name = "margo-desktop"
version = "0.1.0"
description = "Margo desktop authoring companion"
authors = ["Margo contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
