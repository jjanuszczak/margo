name: default
version: 0.1.0
description: Default Margo starter theme
config_options:
  - name: color_mode
    type: string
    description: Light or dark presentation mode
    default: light
    values:
      - light
      - dark
  - name: typography
    type: string
    description: Typography preset for deck tone
    default: editorial
    values:
      - editorial
      - executive
  - name: accent_color
    type: string
    description: Accent color used for emphasis
    default: "#8f6f33"
pptx:
  slide_size: widescreen
  fonts:
    heading: Aptos Display
    body: Aptos
  colors:
    background: "#FFFFFF"
    foreground: "#1F2937"
    accent: "#8F6F33"
  layouts:
    title:
      name: title
      body_y: 2.1
      body_height: 4.7
    section:
      name: section
      body_y: 2.0
      body_height: 4.8
    content:
      name: content
      body_y: 1.55
      body_height: 5.2
    image:
      name: image
      image_position: center
      image_width: 11.2
      image_height: 4.1
    media-left:
      name: media-left
      image_position: left
      image_width: 5.5
    media-right:
      name: media-right
      image_position: right
      image_width: 5.5
