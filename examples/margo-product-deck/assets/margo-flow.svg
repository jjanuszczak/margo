<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Margo authoring flow</title><desc id="desc">Markdown source flows through Margo into HTML, PDF, PNG, and PPTX.</desc><defs><linearGradient id="g" x1="0%" x2="100%"><stop stop-color="#69e3b1"/><stop offset="1" stop-color="#82b8ff"/></linearGradient><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5z" fill="#82b8ff" stroke="none"/></marker></defs><rect width="1200" height="400" rx="26" fill="#0d1d19"/><g font-family="Arial, Helvetica, sans-serif" fill="#f0fff8"><text x="80" y="105" font-size="25" font-weight="700">Markdown</text><text x="80" y="144" font-size="18" fill="#b8d0c6">slides · notes · assets</text><text x="470" y="105" font-size="25" font-weight="700">Margo</text><text x="470" y="144" font-size="18" fill="#b8d0c6">model · theme · build</text><text x="865" y="82" font-size="25" font-weight="700">Shareable output</text><text x="865" y="122" font-size="18" fill="#b8d0c6">HTML</text><text x="865" y="160" font-size="18" fill="#b8d0c6">PDF</text><text x="865" y="198" font-size="18" fill="#b8d0c6">PNG</text><text x="865" y="236" font-size="18" fill="#b8d0c6">PPTX</text></g><g fill="none" stroke="url(#g)" stroke-width="5"><rect x="55" y="55" width="265" height="130" rx="18"/><rect x="435" y="55" width="270" height="130" rx="18"/><line x1="325" y1="120" x2="423" y2="120" marker-end="url(#arrow)"/><line x1="710" y1="120" x2="858" y2="120" marker-end="url(#arrow)"/></g><text x="80" y="325" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#69e3b1">One source of truth. A polished deck at the end.</text></svg>
