name: Deploy Margo product deck

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Margo product deck
        working-directory: examples/margo-product-deck
        run: go run ../../cmd/margo build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/margo-product-deck/dist/html
      - name: Deploy Margo product deck
        id: deployment
        uses: actions/deploy-pages@v4
