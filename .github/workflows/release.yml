name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./scripts/release.sh
      - name: Verify checksums
        run: (cd dist/release && shasum -a 256 -c checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/*.tar.gz dist/release/*.zip dist/release/checksums.txt \
            --generate-notes
