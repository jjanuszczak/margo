name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./scripts/release.sh
      - name: Verify checksums
        run: (cd dist/release && shasum -a 256 -c checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/*.tar.gz dist/release/*.zip dist/release/checksums.txt \
            --generate-notes
      - name: Build Margo product deck
        working-directory: examples/margo-product-deck
        run: go run ../../cmd/margo build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload product deck
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/margo-product-deck/dist/html

  deploy-product-deck:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Margo product deck to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
